---
layout: default
---

<article class="content-container">
  <a href="javascript:history.back()" class="back-link">&larr; Back to list</a>
  <span class="badge-tag">{{ page.category | default: page.layout | capitalize }}</span>
  <h1 style="margin-top: 0.5rem; font-size: 2.25rem;">{{ page.title }}</h1>

  <div class="markdown-body" style="margin-top: 1.5rem;">
    {{ content }}
  </div>
</article>
