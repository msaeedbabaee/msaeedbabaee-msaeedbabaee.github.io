<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ page.title }} | Eng M. S. Babaee</title>
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}?v=4.0">
</head>
<body>
  <header>
    <nav>
      <div class="logo">
        <a href="{{ '/' | relative_url }}">Saeed Babaee</a>
      </div>
      <div class="menu">
        <a href="{{ '/services.html' | relative_url }}">Services</a>
        <a href="{{ '/projects.html' | relative_url }}">Projects</a>
        <a href="{{ '/blog.html' | relative_url }}">Blog</a>
        <a href="{{ '/about.html' | relative_url }}">About</a>
        <a href="{{ '/contact.html' | relative_url }}">Contact</a>
        <button id="themeBtn" onclick="toggleTheme()">🌙</button>
      </div>
    </nav>
  </header>

  <main>
    {{ content }}
  </main>

  <footer>
    <p>&copy; {{ 'now' | date: "%Y" }} Saeed Babaee. All rights reserved.</p>
  </footer>

  <script src="{{ '/assets/js/script.js' | relative_url }}"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const filterBtns = document.querySelectorAll('.filter-btn');
      const cards = document.querySelectorAll('.project-card, .card, .service-card');

      if (!filterBtns.length || !cards.length) return;

      filterBtns.forEach(btn => {
        btn.addEventListener('click', () => {
          filterBtns.forEach(b => b.classList.remove('active'));
          btn.classList.add('active');

          const selectedFilter = btn.getAttribute('data-filter');

          cards.forEach(card => {
            const cardTags = card.getAttribute('data-tags')
              ? card.getAttribute('data-tags').trim().split(/\s+/)
              : [];

            if (selectedFilter === 'all' || cardTags.includes(selectedFilter)) {
              card.classList.remove('is-hidden');
            } else {
              card.classList.add('is-hidden');
            }
          });
        });
      });
    });
  </script>
</body>
</html>
