---
layout: default
---


<article class="project-page">


<h1>
{{page.title}}
</h1>



{% if page.image %}

<img src="{{page.image}}">

{% endif %}



<div class="tags">


{% for tag in page.tags %}

<span>
{{tag}}
</span>


{% endfor %}


</div>



{{content}}



{% if page.github %}

<a class="button"
href="{{page.github}}">
GitHub →
</a>

{% endif %}



{% if page.demo %}

<a class="button"
href="{{page.demo}}">
Live Demo →
</a>

{% endif %}



</article>
