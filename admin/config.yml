backend:

  name: github

  repo: repo: msaeedbabaee/msaeedbabaee.github.io

  branch: main



media_folder:

  assets/images


public_folder:

  /assets/images



collections:


- name: projects

  label: Projects

  folder: _projects

  create: true

  fields:


  - name: title

    label: Title

    widget: string


  - name: image

    label: Image

    widget: image

    required: false


  - name: tags

    label: Tags

    widget: list


  - name: github

    label: GitHub

    widget: string

    required: false


  - name: demo

    label: Demo

    widget: string

    required: false


  - name: body

    label: Content

    widget: markdown



- name: services

  label: Services

  folder: _services

  create: true

  fields:


  - name: title

    label: Title

    widget: string


  - name: body

    label: Content

    widget: markdown



- name: posts

  label: Blog

  folder: _posts

  create: true

  fields:


  - name: title

    label: Title

    widget: string


  - name: body

    label: Article

    widget: markdown
