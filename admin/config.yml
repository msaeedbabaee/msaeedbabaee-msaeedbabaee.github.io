backend:
  name: github
  repo: msaeedbabaee/msaeedbabaee.github.io
  branch: main
  base_url: https://decap-cms-oauth-theta.vercel.app
  auth_endpoint: auth

# Media store location in your repository
media_folder: "assets/images"

# Public URL path for uploaded media files
public_folder: "/assets/images"

# Content Collections Configuration
collections:
  # Blog Posts Collection
  - name: "posts"
    label: "Posts"
    folder: "_posts"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Publish Date", name: "date", widget: "datetime" }
      - { label: "Layout", name: "layout", widget: "hidden", default: "post" }
      - { label: "Excerpt", name: "description", widget: "text", required: false }
      - { label: "Featured Image", name: "image", widget: "image", required: false }
      - { label: "Categories", name: "categories", widget: "list", required: false }
      - { label: "Tags", name: "tags", widget: "list", required: false }
      - { label: "Body", name: "body", widget: "markdown" }

  # Static Pages Collection
  - name: "pages"
    label: "Pages"
    files:
      - label: "About Me"
        name: "about"
        file: "about.md"
        fields:
          - { label: "Title", name: "title", widget: "string" }
          - { label: "Layout", name: "layout", widget: "hidden", default: "page" }
          - { label: "Body", name: "body", widget: "markdown" }
