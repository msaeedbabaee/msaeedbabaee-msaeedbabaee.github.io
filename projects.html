<section class="grid">

{% for project in site.projects %}

<div class="project-card">


{% if project.image %}

<img src="{{project.image}}">

{% endif %}



<div class="card-content">


<div class="category">

{{project.category}}

</div>


<h2>

<a href="{{project.url}}">
{{project.title}}
</a>

</h2>



<p>

{{project.description}}

</p>



<div class="tags">

{% for tech in project.technologies %}

<span>
{{tech}}
</span>

{% endfor %}

</div>



<div class="project-links">


<a href="{{project.url}}">
Details →
</a>


{% if project.github %}

<a href="{{project.github}}">
GitHub
</a>

{% endif %}



</div>


</div>


</div>


{% endfor %}

</section>
